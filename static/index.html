<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Todos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      content: [],
      theme: { extend: {} }
    }

    // Dark mode toggle
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark')
      localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'))
    }

    // Load saved preference
    if (localStorage.getItem('darkMode') === 'true' || 
        (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    }

    // Search functionality
    function filterTasks() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase()
      const cards = document.querySelectorAll('.task-card')

      cards.forEach(card => {
        const text = card.textContent.toLowerCase()
        card.style.display = text.includes(searchTerm) ? 'block' : 'none'
      })
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen py-8 px-4 transition-colors">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-4xl font-bold flex items-center gap-3">
        📅 Daily Todos
      </h1>
      <button onclick="toggleDarkMode()" 
              class="p-3 rounded-xl bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
        <i class="fas fa-moon dark:hidden"></i>
        <i class="fas fa-sun hidden dark:inline"></i>
      </button>
    </div>

    <!-- Search -->
    <div class="mb-8">
      <input 
        type="text" 
        id="searchInput"
        onkeyup="filterTasks()"
        placeholder="Search tasks, titles, or descriptions..."
        class="w-full px-5 py-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-blue-500 text-lg"
      >
    </div>

    <div class="space-y-8" id="tasksContainer">
      {{range $date := .SortedDates}}
        {{$tasks := index .TasksByDate $date}}
        <div class="task-card bg-white dark:bg-gray-900 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
          <!-- Date Header -->
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-5 font-semibold text-xl flex items-center justify-between">
            <span>{{ $date }}</span>
            <span class="text-sm font-normal bg-white/20 px-3 py-1 rounded-full">{{len $tasks}} tasks</span>
          </div>

          <!-- Tasks -->
          <div class="divide-y divide-gray-100 dark:divide-gray-800">
            {{range $tasks}}
              <div class="p-7 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                <h3 class="font-semibold text-2xl mb-3">{{.Title}}</h3>
                <p class="text-gray-600 dark:text-gray-400 leading-relaxed">{{.Description}}</p>
                
                {{if .Link}}
                <a href="{{.Link}}" target="_blank" 
                   class="inline-flex items-center gap-2 mt-4 text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 font-medium">
                  <i class="fas fa-external-link-alt"></i>
                  Open Resource
                </a>
                {{end}}
              </div>
            {{end}}

            {{if eq (len $tasks) 0}}
              <div class="p-16 text-center text-gray-400 dark:text-gray-500">
                No tasks scheduled
              </div>
            {{end}}
          </div>
        </div>
      {{end}}
    </div>
  </div>
</body>
</html>
